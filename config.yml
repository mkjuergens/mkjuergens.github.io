theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Research
          url: research/
          weight: 3
        - name: Talks
          url: talks/
          weight: 4
        - name: Teaching
          url: teaching/
          weight: 5
        - name: Blog
